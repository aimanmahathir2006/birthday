<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Maira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cormorant Garamond', serif;
            background-color: #fdf8f5;
            /* Gradient background with floating hearts SVG pattern */
            background-image: 
                radial-gradient(circle at center, rgba(255,230,225,0.8) 0%, rgba(253,248,245,1) 70%),
                url("data:image/svg+xml,%3Csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cg id='heart'%3E%3Cpath fill='%23d8a0a0' opacity='0.35' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/g%3E%3C/defs%3E%3Cuse href='%23heart' x='10%25' y='15%25' transform='scale(0.5)'/%3E%3Cuse href='%23heart' x='80%25' y='20%25' transform='scale(0.4)'/%3E%3Cuse href='%23heart' x='15%25' y='70%25' transform='scale(0.45)'/%3E%3Cuse href='%23heart' x='85%25' y='75%25' transform='scale(0.5)'/%3E%3Cuse href='%23heart' x='40%25' y='10%25' transform='scale(0.4)'/%3E%3Cuse href='%23heart' x='60%25' y='20%25' transform='scale(0.35)'/%3E%3Cuse href='%23heart' x='28%25' y='50%25' transform='scale(0.4)'/%3E%3Cuse href='%23heart' x='72%25' y='78%25' transform='scale(0.4)'/%3E%3C/svg%3E");
            background-size: cover;
            position: relative;
            overflow: hidden;
            color: #2b1e1a;
            padding: 20px;
        }

        .card {
            text-align: center;
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .subtitle-top {
            font-size: 0.85rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: #b88686;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .script-heading {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3rem, 8vw, 5.5rem);
            color: #d19595;
            font-weight: 400;
            line-height: 1;
            margin-bottom: -0.2em;
            text-shadow: 0 0 1px rgba(209, 149, 149, 0.2);
        }

        .main-name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(4.5rem, 14vw, 9.5rem);
            font-weight: 700;
            color: #211512;
            line-height: 1;
            letter-spacing: -0.02em;
            margin-bottom: 2rem;
        }

        .quote {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            font-style: italic;
            color: #7a635a;
            max-width: 550px;
            line-height: 1.5;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        .divider-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 160px;
            position: relative;
        }

        .divider-line {
            height: 1px;
            background-color: #e5bebe;
            flex-grow: 1;
        }

        .heart-icon {
            color: #b54949;
            font-size: 0.75rem;
            margin: 0 10px;
        }

        .help-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 32px;
            height: 32px;
            background-color: #1a1a1a;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <main class="card">
        <p class="subtitle-top">Today is your day</p>
        <h2 class="script-heading">Happy Birthday</h2>
        <h1 class="main-name">Maira</h1>
        <p class="quote">On this day, the world became a better place &mdash; and I am the luckiest person in it.</p>
        
        <div class="divider-container">
            <div class="divider-line"></div>
            <span class="heart-icon">&#9829;</span>
            <div class="divider-line"></div>
        </div>
    </main>

    <div class="help-button" title="Help">?</div>

</body>
</html>
