<script>
    let currentPage = 1;
    const totalPages = 2;

    const wrapper = document.getElementById('wrapper');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const indicator = document.getElementById('page-indicator');

    const audio = document.getElementById('bg-music');
    const fixedAudioBtn = document.getElementById('fixed-audio-btn');
    const fixedAudioIcon = document.getElementById('fixed-audio-icon');
    const fixedAudioText = document.getElementById('fixed-audio-text');

    const lyricsContainer = document.getElementById('lyrics-container');

    // GitHub file paths
    const localTxtPath = "Noh Salleh - Biar Seribu.txt";
    const githubTxtPath = "https://raw.githubusercontent.com/aimanmahathir2006/maira/main/Noh%20Salleh%20-%20Biar%20Seribu.txt";
    const cdnTxtPath = "https://cdn.jsdelivr.net/gh/aimanmahathir2006/maira@main/Noh%20Salleh%20-%20Biar%20Seribu.txt";

    // Estimated timestamps (in seconds) corresponding to each line
    const lineTimestamps = [24, 30, 36, 48, 54, 60, 72, 78, 84, 90, 96, 102, 108, 120, 126, 132, 138, 144, 150, 156, 168, 174, 180];

    // Function to load and render lyrics from .txt file
    async function loadLyrics() {
        let textData = "";
        try {
            // Attempt 1: Fetch local relative file
            let response = await fetch(localTxtPath);
            if (!response.ok) throw new Error("Local fetch failed");
            textData = await response.text();
        } catch (e1) {
            try {
                // Attempt 2: Fetch direct GitHub Raw URL
                let response = await fetch(githubTxtPath);
                if (!response.ok) throw new Error("GitHub fetch failed");
                textData = await response.text();
            } catch (e2) {
                try {
                    // Attempt 3: Fetch CDN URL
                    let response = await fetch(cdnTxtPath);
                    textData = await response.text();
                } catch (e3) {
                    lyricsContainer.innerHTML = `<p class="lyric-line active">Error loading lyrics file.</p>`;
                    return;
                }
            }
        }

        // Process text into lines
        const lines = textData.split('\n').filter(line => line.trim() !== '');
        lyricsContainer.innerHTML = '';

        lines.forEach((lineText, index) => {
            const p = document.createElement('p');
            p.className = 'lyric-line';
            // Assign corresponding timestamp from array if available
            const time = lineTimestamps[index] !== undefined ? lineTimestamps[index] : index * 5;
            p.setAttribute('data-time', time);
            p.textContent = lineText.trim();
            lyricsContainer.appendChild(p);
        });
    }

    // Initialize lyrics load
    loadLyrics();

    function toggleAudio() {
        if (audio.paused) {
            audio.play().then(() => {
                fixedAudioIcon.textContent = '🔊';
                fixedAudioText.textContent = 'Pause';
            }).catch(err => {
                console.error("Audio playback error:", err);
                fixedAudioText.textContent = 'Error Loading';
            });
        } else {
            audio.pause();
            fixedAudioIcon.textContent = '🎵';
            fixedAudioText.textContent = 'Play Music';
        }
    }

    fixedAudioBtn.addEventListener('click', toggleAudio);

    /* Lyrics Sync & Auto-scroll Logic */
    audio.addEventListener('timeupdate', () => {
        const lyricLines = document.querySelectorAll('.lyric-line');
        const currentTime = audio.currentTime;
        let currentLine = null;

        lyricLines.forEach((line, index) => {
            const lineTime = parseFloat(line.getAttribute('data-time'));
            const nextLineTime = lyricLines[index + 1] 
                ? parseFloat(lyricLines[index + 1].getAttribute('data-time')) 
                : Infinity;

            if (currentTime >= lineTime && currentTime < nextLineTime) {
                line.classList.add('active');
                currentLine = line;
            } else {
                line.classList.remove('active');
            }
        });

        if (currentLine) {
            const containerHeight = lyricsContainer.clientHeight;
            const lineTop = currentLine.offsetTop;
            const lineHeight = currentLine.clientHeight;
            lyricsContainer.scrollTop = lineTop - (containerHeight / 2) + (lineHeight / 2);
        }
    });

    function updateView() {
        wrapper.style.transform = `translateX(-${(currentPage - 1) * 100}vw)`;
        indicator.textContent = `${currentPage} / ${totalPages}`;
        
        prevBtn.disabled = currentPage === 1;
        nextBtn.disabled = currentPage === totalPages;
    }

    prevBtn.addEventListener('click', () => {
        if (currentPage > 1) {
            currentPage--;
            updateView();
        }
    });

    nextBtn.addEventListener('click', () => {
        if (currentPage < totalPages) {
            currentPage++;
            updateView();
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ') {
            if (currentPage < totalPages) {
                currentPage++;
                updateView();
            }
        } else if (e.key === 'ArrowLeft') {
            if (currentPage > 1) {
                currentPage--;
                updateView();
            }
        }
    });
</script>
